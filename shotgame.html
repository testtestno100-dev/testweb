<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOT! - 測試版</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons 圖標-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 字體-->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+TC:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="gamecolor.css">
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center relative select-none">

    <!-- 背景夜店氛圍動態微光 -->
    <div class="absolute inset-0 z-0 opacity-40 pointer-events-none">
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-pink-600 rounded-full filter blur-[120px]"></div>
        <div class="absolute bottom-1/4 left-1/3 w-80 h-80 bg-purple-700 rounded-full filter blur-[100px]"></div>
        <div class="absolute top-2/3 right-1/4 w-72 h-72 bg-amber-500 rounded-full filter blur-[110px]"></div>
    </div>

    <!-- 頂部頁首與控制鈕 -->
    <header class="w-full max-w-md p-4 z-30 flex justify-between items-center relative">
        <!-- 左上角遊戲說明按鈕 -->
        <button id="btn-open-info" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-gray-300 hover:text-white border border-white/20 active:scale-95 transition-all cursor-pointer">
            <i class="fa-solid fa-circle-info text-lg"></i>
        </button>

        <!-- 標題 -->
        <div class="flex flex-col items-center pointer-events-none">
            <h1 class="text-3xl title-font font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-amber-300 neon-text-pink">
                SHOT!
            </h1>
            <span class="text-[10px] text-gray-400 font-bold tracking-widest mt-0.5">-測試版-</span>
        </div>

        <!-- 右上角排行榜冠軍杯 -->
        <button id="btn-open-leaderboard" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-amber-400 hover:text-amber-300 border border-amber-500/30 active:scale-95 transition-all cursor-pointer">
            <i class="fa-solid fa-trophy text-lg"></i>
        </button>
    </header>

    <!-- 主頁面：封面模式選擇選單 (首頁狀態) -->
    <div id="home-menu" class="w-full max-w-md flex-1 flex flex-col justify-center items-center px-6 z-30 space-y-4">
        <!-- 中間預設啤酒展示 -->
        <div class="beer-glass w-36 h-48 relative mb-6 pointer-events-none">
            <div class="beer-liquid" style="height: 100%;">
                <div class="beer-foam"></div>
                <div class="bubble w-2 h-2 left-4" style="animation-delay: 0s;"></div>
                <div class="bubble w-3 h-3 left-12" style="animation-delay: 0.5s;"></div>
            </div>
        </div>

        <button data-mode="normal" class="mode-btn w-full py-4 glass-card rounded-2xl font-bold text-lg text-white border border-pink-500/40 hover:bg-pink-600/30 active:scale-95 transition-all flex items-center justify-center space-x-2 cursor-pointer">
            <i class="fa-solid fa-beer-mug-empty text-amber-400"></i>
            <span>普通模式</span>
        </button>

        <button data-mode="hard" class="mode-btn w-full py-4 glass-card rounded-2xl font-bold text-lg text-white border border-purple-500/40 hover:bg-purple-600/30 active:scale-95 transition-all flex items-center justify-center space-x-2 cursor-pointer">
            <i class="fa-solid fa-fire text-red-500"></i>
            <span>困難模式</span>
        </button>

        <button data-mode="extreme" class="mode-btn w-full py-4 glass-card rounded-2xl font-bold text-lg text-white border border-amber-500/40 hover:bg-amber-600/30 active:scale-95 transition-all flex items-center justify-center space-x-2 cursor-pointer">
            <i class="fa-solid fa-bolt text-yellow-400"></i>
            <span>極限模式</span>
        </button>
    </div>

    <!-- 遊戲進行與結算區域 (遊戲狀態) -->
    <main id="game-container" class="hidden w-full max-w-md flex-1 flex flex-col justify-between items-center relative z-20 px-4 py-2">
        
        <!-- 上方資訊欄 -->
        <div class="w-full flex justify-between items-center px-6 py-3 glass-card rounded-2xl border border-white/10 my-2 pointer-events-none">
            <div class="flex flex-col">
                <span class="text-xs text-gray-400 font-bold">倒數秒數</span>
                <span id="timer-display" class="pixel-font text-3xl font-bold text-amber-400 neon-text-yellow mt-1">15</span>
            </div>
            <div class="flex flex-col items-end">
                <span id="clicks-label" class="text-xs text-gray-400 font-bold">SHOT數</span>
                <span id="clicks-display" class="pixel-font text-3xl font-extrabold text-pink-500 neon-text-pink mt-1">90</span>
            </div>
        </div>

        <!-- 畫面中央：巨大連點點擊感應區 -->
        <div id="tap-target-area" class="w-full flex-1 flex flex-col items-center justify-center relative my-2 cursor-pointer rounded-3xl transition-all">
            
            <div id="status-overlay" class="hidden absolute inset-0 z-40 flex flex-col items-center justify-center bg-black/80 rounded-3xl backdrop-blur-sm pointer-events-none">
                <span id="status-overlay-text" class="pixel-font text-5xl text-pink-500 animate-pulse text-center leading-tight">Ready?</span>
            </div>

            <div class="beer-glass w-48 h-64 mx-auto relative flex flex-col justify-end p-1 pointer-events-none">
                <div id="beer-liquid" class="beer-liquid" style="height: 100%;">
                    <div class="beer-foam"></div>
                    <div class="bubble w-2 h-2 left-4" style="animation-delay: 0s;"></div>
                    <div class="bubble w-3 h-3 left-12" style="animation-delay: 0.5s;"></div>
                    <div class="bubble w-2 h-2 left-24" style="animation-delay: 1.2s;"></div>
                    <div class="bubble w-4 h-4 left-36" style="animation-delay: 0.8s;"></div>
                </div>
            </div>

            <div id="tap-hint" class="text-center mt-4 text-xs text-pink-300 font-bold tracking-widest animate-bounce pointer-events-none">
                ⚡點擊中間區域一乾而盡！⚡
            </div>
        </div>

        <!-- 下方控制按鈕區 -->
        <div class="w-full flex flex-col space-y-2 z-30 mb-2 relative">
            <div class="flex space-x-3 w-full">
                <button id="btn-left" class="flex-1 py-3.5 bg-gray-800/90 hover:bg-gray-700/90 text-gray-300 border border-gray-600/50 rounded-xl font-bold text-sm glass-card active:scale-95 transition-all cursor-pointer">
                    終止挑戰
                </button>
                <button id="btn-right" class="flex-1 py-3.5 bg-purple-900/90 hover:bg-purple-800/90 text-purple-200 border border-purple-500/50 rounded-xl font-bold text-sm glass-card active:scale-95 transition-all cursor-pointer">
                    重新挑戰
                </button>
            </div>
            
            <button id="btn-next-mode" class="hidden w-full py-3.5 bg-gradient-to-r from-pink-500 to-amber-500 text-white font-bold rounded-xl text-sm shadow-lg active:scale-95 transition-all cursor-pointer">
                困難模式
            </button>
        </div>

    </main>

    <!-- 底部製作人宣告 -->
    <footer class="w-full text-center py-3 text-xs text-gray-500 font-bold tracking-widest z-30 pointer-events-none">
        -製作人：麻糬-
    </footer>

    <!-- ------------------ MODALS (彈窗系統) ------------------ -->

    <!-- 1. 左上角遊戲說明 Modal -->
    <div id="info-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
        <div class="glass-card w-full max-w-sm rounded-2xl p-6 border border-pink-500/40 relative flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-white/10">
                <h3 class="text-lg font-bold text-pink-400">遊戲說明</h3>
                <button id="btn-close-info" class="text-gray-400 hover:text-white text-lg cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-3 text-xs text-gray-200 leading-relaxed font-medium">
                <p>1. 普通模式：15秒內點擊螢幕90下即挑戰成功。</p>
                <p>2. 困難模式：15秒內點擊螢幕120下即挑戰成功。</p>
                <p>3. 極限模式：挑戰15秒內最多點擊數。</p>
                <p>4. 排行榜僅會記錄一週內的極限模式分數。</p>
                <p>5. 測試版小遊戲僅供娛樂用。</p>
            </div>
            <button id="btn-close-info-bottom" class="mt-6 w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold rounded-xl text-xs cursor-pointer">
                關閉
            </button>
        </div>
    </div>

    <!-- 2. 極限模式輸入暱稱 Modal -->
    <div id="nickname-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
        <div class="glass-card w-full max-w-sm rounded-2xl p-6 border border-amber-500/40 relative flex flex-col items-center">
            <div class="w-12 h-12 bg-amber-500/20 rounded-full flex items-center justify-center mb-3 text-amber-400 text-xl border border-amber-500/40">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <h3 class="text-lg font-bold text-white mb-2">準備進入極限賽</h3>
            <p class="text-xs text-gray-300 text-center mb-4 leading-relaxed">
                輸入您的暱稱，挑戰極限!
            </p>
            
            <input type="text" id="player-nickname" placeholder="請輸入暱稱" maxlength="12" class="w-full px-4 py-3 bg-gray-900/90 border border-purple-500/50 rounded-xl text-white text-center focus:outline-none focus:border-pink-500 mb-6 font-bold tracking-wider text-sm">

            <div class="flex space-x-3 w-full">
                <button id="btn-cancel-nickname" class="flex-1 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold rounded-xl text-xs cursor-pointer">
                    取消
                </button>
                <button id="btn-confirm-nickname" class="flex-1 py-2.5 bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold rounded-xl text-xs shadow-lg cursor-pointer">
                    開始挑戰！
                </button>
            </div>
        </div>
    </div>

    <!-- 3. 右上角雲端排行榜 Modal -->
    <div id="leaderboard-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
        <div class="glass-card w-full max-w-md rounded-2xl p-6 border border-purple-500/40 flex flex-col h-[75vh]">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-white/10">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-trophy text-amber-400 text-xl"></i>
                    <h3 class="text-lg font-bold text-white tracking-wider">極限排行榜</h3>
                </div>
                <button id="btn-close-leaderboard" class="text-gray-400 hover:text-white text-lg px-2 cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- 排行榜清單 -->
            <div id="leaderboard-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <div class="text-center py-10 text-gray-400 text-sm">
                    <i class="fa-solid fa-spinner animate-spin text-2xl text-pink-500 mb-2"></i><br>
                    雲端資料載入中...
                </div>
            </div>

            <div class="mt-4 pt-3 border-t border-white/10 flex justify-between items-center text-[10px] text-gray-400">
                <span>資料若未即時同步，請刷新</span>
                <button id="btn-refresh-leaderboard" class="text-pink-400 hover:text-pink-300 font-bold text-xs cursor-pointer">
                    <i class="fa-solid fa-rotate mr-1"></i>重新整理
                </button>
            </div>
        </div>
    </div>

</body>
<script type="module" src="gamepull.js"></script>
</html>
